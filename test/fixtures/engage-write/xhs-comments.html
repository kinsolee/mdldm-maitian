<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>小红书通知-评论和@（写入测试页）</title>
<style>
  body { font: 14px sans-serif; margin: 20px; }
  .container-item { padding: 8px; border-bottom: 1px solid #eee; }
  .action-reply { display: inline-block; color: #36c; cursor: pointer; margin-right: 12px; }
  textarea { width: 300px; }
  .toast-t { position: fixed; top: 4px; right: 4px; }
</style>
</head>
<body>
<div class="notification-list"></div>
<div id="toast"></div>
<script>
// 模式（?mode=）：ok | fail（接口 code≠0 + toast）| silent | mangle | gone | replied | nouid
const mode = new URLSearchParams(location.search).get('mode') || 'ok';
const ME = 'me_x', ME_NICK = '麦田测试号';
// 仿主站：页面状态里有当前登录用户（适配器的真实读法之一，不需要测试钩子）
if (mode !== 'nouid') window.__INITIAL_STATE__ = { user: { userInfo: { user_id: ME, nickname: mode === 'nonick' ? null : ME_NICK } } };
let sendClicks = 0, seq = 0;
const now = Math.floor(Date.now() / 1000);
const mentions = [
  { id: 'nt1', type: 'comment/item', title: '评论了你的笔记', time: now - 600, user_info: { userid: 'u1', nickname: '甲' }, comment_info: { id: 'xc1', content: '小红书评论一，写得真好' }, item_info: { id: 'note1', xsec_token: 'tok-should-not-leak' } },
  { id: 'nt2', type: 'comment/item', title: '评论了你的笔记', time: now - 900, user_info: { userid: 'u2', nickname: '乙' }, comment_info: { id: 'xc2', content: '第二条评论' }, item_info: { id: 'note1', xsec_token: 'tok-should-not-leak' } },
];
if (mode === 'img') { mentions[0].comment_info.content = ''; mentions.push({ id: 'nt3', type: 'comment/item', title: '评论了你的笔记', time: now - 1200, user_info: { userid: 'u1', nickname: '甲' }, comment_info: { id: 'xc3', content: '甲的另一条文字评论' }, item_info: { id: 'note1' } }); }
// 仿挂钩：页面自己发的 you/mentions 响应被 installHook 抄进 window.__engCap（file:// 发不了真请求，直接放进去）
const cap = (url, body) => (window.__engCap ||= []).push({ url, t: Date.now(), body: JSON.stringify(body) });
cap('https://edith.xiaohongshu.com/api/sns/web/v1/you/mentions', { code: 0, success: true, data: { has_more: false, message_list: mentions } });

const list = document.querySelector('.notification-list');
for (const m of mentions) {
  if (mode === 'img' && !m.comment_info.content) continue;   // 纯图片评论这一行没渲染出来，页面上只有同一人的另一条文字评论
  const el = document.createElement('div');
  el.className = 'container-item';
  const gone = mode === 'gone' && m.comment_info.id === 'xc1';
  el.innerHTML = `<div class="user-name">${m.user_info.nickname}</div><div class="interaction-hint">${m.title}</div>
    <div class="interaction-content">${gone ? '该评论已删除' : m.comment_info.content}</div>
    <div class="actions"><div class="action-reply">回复</div><div class="action-like">赞</div></div>`;
  if (mode === 'replied' && m.comment_info.id === 'xc1') el.insertAdjacentHTML('beforeend', `<div class="reply-content-show"><span class="name">${ME_NICK}</span>：之前回过了</div>`);
  el.querySelector('.action-reply').onclick = () => openReply(el, m);
  list.appendChild(el);
}

function openReply(el, m) {
  document.querySelectorAll('.reply-box').forEach((x) => x.remove());
  const box = document.createElement('div');
  box.className = 'reply-box';
  box.innerHTML = `<textarea class="comment-input" placeholder="回复 ${m.user_info.nickname}"></textarea><button class="submit">发送</button>`;
  el.appendChild(box);
  const ta = box.querySelector('textarea');
  if (mode === 'mangle') ta.addEventListener('input', () => { if (!ta.dataset.m) { ta.dataset.m = '1'; ta.value = ta.value.replace(/./, '*'); } });
  box.querySelector('button').onclick = () => onSend(m, ta);
}

function onSend(m, ta) {
  sendClicks++;
  const text = ta.value;
  if (mode === 'silent') return;
  setTimeout(() => {
    if (mode === 'fail') {
      cap('https://edith.xiaohongshu.com/api/sns/web/v1/comment/post', { code: -9131, success: false, msg: '评论失败' });
      document.getElementById('toast').innerHTML = '<div class="toast-t">评论失败，请稍后再试</div>';
      return;
    }
    cap('https://edith.xiaohongshu.com/api/sns/web/v1/comment/post', { code: 0, success: true, data: { comment: { id: 'newc' + (++seq), note_id: m.item_info.id, content: text, user_info: { user_id: ME, nickname: ME_NICK }, target_comment: { id: m.comment_info.id } } } });
    ta.value = '';
  }, 300);
}

window.__probe = () => ({
  sendClicks,
  boxes: [...document.querySelectorAll('textarea.comment-input')].map((b) => b.value),
});
</script>
</body>
</html>
