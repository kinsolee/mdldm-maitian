<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>视频号私信（写入测试页）</title></head>
<body>
<wujie-app></wujie-app>
<script>
// 模式（?mode=）：ok | fail | silent | mangle | lastme | nobox | nouid
const mode = new URLSearchParams(location.search).get('mode') || 'ok';
if (mode !== 'nouid') window.__loginUser = { uniqId: 'v2_me', nickname: '麦田测试号' };
const ME_USER = 'me_finder';
let sendClicks = 0, seq = 0, openId = null;
const sr = document.querySelector('wujie-app').attachShadow({ mode: 'open' });
sr.innerHTML = `<style>
  .session-item { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
  textarea { width: 300px; }
  .weui-desktop-toast { position: fixed; top: 4px; right: 4px; }
</style><div class="session-wrap"><div class="session-list"></div></div><div class="chat-panel"></div><div class="toast-holder"></div>`;
const ts = Math.floor(Date.now() / 1000) - 3600;
// 仿 S0：messageList 新到旧
const msg = (msgId, from, to, t, text) => ({ message: { msgId, fromUsername: from, toUsername: to, ts: t, msgType: 1, textMsg: { content: text } } });
const sessionList = [
  ['s_1', { sessionInfo: { sessionId: 's_1', username: 'peer_a', nickname: '甲' }, messageList: [msg('m2', 'peer_a', ME_USER, ts + 10, '在吗'), msg('m1', ME_USER, 'peer_a', ts, '你好')], newMsgCount: 1, sessionIsUnread: true, sessionType: 1 }],
  ['s_2', { sessionInfo: { sessionId: 's_2', username: 'peer_b', nickname: '乙' }, messageList: [msg('m3', 'peer_b', ME_USER, ts, '哈喽')], newMsgCount: 0, sessionIsUnread: false, sessionType: 1 }],
];
if (mode === 'lastme') sessionList[0][1].messageList.unshift(msg('m9', ME_USER, 'peer_a', ts + 20, '稍等'));
sr.querySelector('.session-wrap').__vue__ = { $data: { sessionList } };

function renderList() {
  const l = sr.querySelector('.session-list');
  l.innerHTML = '';
  for (const [id, s] of sessionList) {
    const el = document.createElement('div');
    el.className = 'session-item';
    el.textContent = s.sessionInfo.nickname + '：' + s.messageList[0].message.textMsg.content;
    el.__vue__ = { $props: { session: s.sessionInfo } };
    el.onclick = () => { openId = mode === 'swap' ? sessionList[1][0] : id; renderPanel(); };
    l.appendChild(el);
  }
}

function renderPanel() {
  const s = sessionList.find(([id]) => id === openId)[1];
  const p = sr.querySelector('.chat-panel');
  p.innerHTML = '';
  // 仿 Vue：聊天区组件的 props 里带当前会话
  p.__vue__ = { $props: { session: s.sessionInfo } };
  for (const m of [...s.messageList].reverse()) { const d = document.createElement('div'); d.textContent = m.message.textMsg.content; p.appendChild(d); }
  if (mode === 'nobox') return;
  const f = document.createElement('div');
  f.className = 'footer';
  f.innerHTML = '<textarea class="edit_area"></textarea><div class="op"><button class="weui-desktop-btn">发送</button></div>';
  p.appendChild(f);
  const ta = f.querySelector('textarea');
  if (mode === 'mangle') ta.addEventListener('input', () => { if (!ta.dataset.m) { ta.dataset.m = '1'; ta.value = ta.value.slice(0, -1); } });
  f.querySelector('button').onclick = () => onSend(s, ta);
}

function toast(m) { sr.querySelector('.toast-holder').innerHTML = `<div class="weui-desktop-toast"><span>${m}</span></div>`; }

function onSend(s, ta) {
  sendClicks++;
  const text = ta.value;
  if (mode === 'fail') { setTimeout(() => toast('发送失败'), 200); return; }
  if (mode === 'silent') return;
  setTimeout(() => { s.messageList.unshift(msg('nm' + (++seq), ME_USER, s.sessionInfo.username, Math.floor(Date.now() / 1000), text)); renderList(); renderPanel(); }, 300);
}

window.__probe = () => ({
  sendClicks, openId,
  boxes: [...sr.querySelectorAll('textarea.edit_area')].map((b) => b.value),
  mine: sessionList.flatMap(([id, s]) => s.messageList.filter((m) => m.message.msgId.startsWith('nm')).map((m) => ({ session: id, text: m.message.textMsg.content }))),
});
renderList();
</script>
</body>
</html>
