<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>视频号互动管理-评论（写入测试页）</title></head>
<body>
<!-- 仿 S0：业务页面在 wujie 微前端的开放 shadowRoot 里，组件数据挂在元素的 __vue__ 上 -->
<wujie-app></wujie-app>
<script>
// 模式（?mode=）：ok | fail | silent | mangle | gone | replied | nouid
const mode = new URLSearchParams(location.search).get('mode') || 'ok';
const ME_NICK = '麦田测试号';
if (mode !== 'nouid') window.__loginUser = { uniqId: 'v2_me', nickname: ME_NICK };
let sendClicks = 0, likeClicks = 0, seq = 0, current = 'n1';
const sr = document.querySelector('wujie-app').attachShadow({ mode: 'open' });
sr.innerHTML = `<style>
  .comment-feed-wrap { padding: 6px; border-bottom: 1px solid #eee; cursor: pointer; }
  .comment-item { padding: 6px; border-bottom: 1px solid #eee; }
  .weui-icon-outlined-comment { display: inline-block; width: 18px; height: 18px; background: #ccc; cursor: pointer; }
  .like-action { margin-left: 12px; }
  textarea { width: 300px; }
  .weui-desktop-toast { position: fixed; top: 4px; right: 4px; }
</style><div class="page"><div class="feeds-col"></div><div class="comments-col"></div><div class="toast-holder"></div></div>`;
const now = Math.floor(Date.now() / 1000);
const feeds = [
  { objectNonce: 'n1', objectId: 'o1', createTime: now - 3600, commentCount: 1, desc: { description: '作品一' } },
  { objectNonce: 'n2', objectId: 'o2', createTime: now - 86400, commentCount: 3, desc: { description: '作品二' } },
];
const C = (commentId, nick, text, extra = {}) => ({ commentId, commentNickname: nick, commentContent: text, commentCreatetime: String(now - 600), commentLikeCount: 0, levelTwoComment: [], ...extra });
const comments = {
  n1: [C('x1', '丁', '作品一的评论')],
  n2: [C('cc1', '甲', '视频号评论一', { levelTwoComment: [C('cc1r1', '乙', '二楼一条')] }), C('cc2', '丙', '视频号评论二')],
};
if (mode === 'replied') comments.n2[0].levelTwoComment.push(C('cc1me', ME_NICK, '之前回过了'));

const feedsCol = sr.querySelector('.feeds-col');
feedsCol.__vue__ = { commentFeeds: feeds };
for (const f of feeds) {
  const w = document.createElement('div');
  w.className = 'comment-feed-wrap';
  w.innerHTML = `${f.desc.description} <span class="feed-comment-total">${f.commentCount}</span>`;
  w.onclick = () => { current = f.objectNonce; render(); };
  feedsCol.appendChild(w);
}

function item(c) {
  const el = document.createElement('div');
  el.className = 'comment-item';
  el.__vue__ = { $props: { dataSource: c } };
  const gone = mode === 'gone' && c.commentId === 'cc1';
  el.innerHTML = `<span class="nick">${c.commentNickname}</span>：<span class="content">${gone ? '该评论已删除' : c.commentContent}</span>
    <div class="ops"><i class="weui-icon-outlined-comment" title="回复"></i><span class="like-action">赞</span></div>`;
  el.querySelector('.weui-icon-outlined-comment').onclick = () => openReply(el, c);
  el.querySelector('.like-action').onclick = () => { likeClicks++; };
  return el;
}

function render() {
  const col = sr.querySelector('.comments-col');
  col.innerHTML = '';
  // 仿 S6a：二楼同时在一楼的 levelTwoComment 里，也单独渲染成一个 .comment-item
  for (const c of comments[current]) { col.appendChild(item(c)); for (const r of c.levelTwoComment) col.appendChild(item(r)); }
  // stuck：还有没展开的回复（我的旧回复藏在里面），「展开更多回复」点了没反应
  if (mode === 'stuck') { const m = document.createElement('div'); m.className = 'more'; m.innerHTML = '<span>展开更多回复</span>'; col.appendChild(m); }
}

function openReply(el, c) {
  sr.querySelectorAll('.reply-box').forEach((x) => x.remove());
  const box = document.createElement('div');
  box.className = 'reply-box';
  box.innerHTML = `<textarea class="create-input" placeholder="回复 ${c.commentNickname}"></textarea><div class="btn-row"><button class="weui-desktop-btn weui-desktop-btn_primary">发送</button></div>`;
  el.appendChild(box);
  const ta = box.querySelector('textarea');
  if (mode === 'mangle') ta.addEventListener('input', () => { if (!ta.dataset.m) { ta.dataset.m = '1'; ta.value = ta.value + '！'; } });
  box.querySelector('button').onclick = () => onSend(c, ta);
}

function toast(msg) { sr.querySelector('.toast-holder').innerHTML = `<div class="weui-desktop-toast"><span>${msg}</span></div>`; }

function onSend(target, ta) {
  sendClicks++;
  const text = ta.value;
  if (mode === 'fail') { setTimeout(() => toast('回复失败'), 200); return; }
  if (mode === 'silent') return;
  const root = comments[current].find((c) => c.commentId === target.commentId || c.levelTwoComment.some((r) => r.commentId === target.commentId));
  const n = C('new' + (++seq), ME_NICK, text, root.commentId === target.commentId ? {} : { replyCommentId: target.commentId });
  setTimeout(() => { root.levelTwoComment.push(n); render(); }, 300);
}

window.__probe = () => ({
  sendClicks, likeClicks,
  boxes: [...sr.querySelectorAll('textarea.create-input')].map((b) => b.value),
  mine: Object.values(comments).flat().flatMap((c) => c.levelTwoComment).filter((r) => r.commentId.startsWith('new')).map((r) => ({ commentId: r.commentId, text: r.commentContent, replyCommentId: r.replyCommentId ?? null })),
});
render();
</script>
</body>
</html>
